name: anderson-fair
# DISABLED 2026-07-17: andersonfair.net removed its Squarespace /events
# collection (hard 404); shows are now sold as commerce PRODUCTS under
# /show-tickets (dates embedded in product titles like "Sunny Jim Sept 18"),
# which the squarespace event parser cannot read. Re-enable with a small
# products-collection parser, or when the venue restores an events page.
disabled: true
type: squarespace
proxy: true
description: "Anderson Fair"
url: https://andersonfair.net/events
friendlyLink: https://andersonfair.net/
tags: [Music, Folk, Community, Montrose]
geo:
  lat: 29.7447
  lng: -95.4034
  label: "Anderson Fair, 2007 Grant St, Houston, TX 77006"
# Note: Anderson Fair's Squarespace site uses client-side rendered calendar.
# proxy: true enables Browserbase fetching which executes JavaScript to load
# the calendar data. The SquarespaceRipper will then parse the ?format=json endpoint.
calendars:
  - name: anderson-fair
    friendlyname: "Anderson Fair"
    timezone: America/Chicago

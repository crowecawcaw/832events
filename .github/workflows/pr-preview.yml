name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel an in-progress preview build when a newer commit is pushed to the same
# PR. The group is keyed by PR number, so different PRs never affect each other;
# only a superseded commit's build (which nobody is waiting on) is cancelled.
# This covers the expensive `build` job too — previously only the cheap
# deploy-preview job had cancellation.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-calendars.yml
    permissions:
      id-token: write    # OIDC token for AWS proxy authentication
      contents: read
    secrets: inherit
    with:
      artifact-name: pr-preview-${{ github.event.number }}
      # Previews are served from
      # https://crowecawcaw.github.io/832events/preview/<PR>/. The web bundle's
      # relative Vite base ('./') resolves asset URLs against that directory on
      # its own, so no absolute base-path is needed here.

  deploy-preview:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write   # peaceiris pushes the preview into the gh-pages branch
      pull-requests: write
    # Share the single gh-pages serialization lane with the main publish and the
    # cleanup job so concurrent pushes to the branch never race. Queued, not
    # cancelled (a half-applied gh-pages commit would be worse than a short wait).
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    outputs:
      deployment-url: ${{ steps.deploy-url.outputs.deployment-url }}
    steps:
      # For scripts/preview-comment.cjs (the PR-comment builder). Must run
      # BEFORE the artifact download — checkout cleans the workspace.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-${{ github.event.number }}
          path: output

      - name: Deploy preview to GitHub Pages
        id: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          # Publish into preview/<PR>/ only. With destination_dir set, peaceiris
          # replaces just that subtree and leaves the production site and other
          # PRs' previews untouched.
          destination_dir: preview/${{ github.event.number }}
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy PR #${{ github.event.number }} preview"

      - name: Compute preview URL
        run: echo "deployment-url=https://crowecawcaw.github.io/832events/preview/${{ github.event.number }}/" >> "$GITHUB_OUTPUT"
        id: deploy-url

      - name: Comment PR with preview link
        uses: actions/github-script@v7
        # Build outputs are passed through env (not template-interpolated into
        # the script source) so calendar names with quotes/backticks can't
        # break or inject the script. Body construction lives in
        # scripts/preview-comment.cjs, unit-tested by preview-comment.test.ts.
        env:
          ERROR_COUNT: ${{ needs.build.outputs.error-count }}
          ZERO_EVENT_CALENDARS: ${{ needs.build.outputs.zero-event-calendars }}
          NEW_ZERO_EVENT_SOURCES: ${{ needs.build.outputs.new-zero-event-sources }}
          PREVIEW_URL: ${{ steps.deploy-url.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { run } = require('./scripts/preview-comment.cjs');
            await run({ github, context, env: process.env });

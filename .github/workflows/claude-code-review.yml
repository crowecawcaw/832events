name: Claude Code Review

# ⚠️ CURRENTLY DISABLED in the Actions UI (2026-06-14) — PRs get NO automatic
# review, so treat human review as the merge gate. Prompts/docs that say "wait
# for Claude Code Review" don't apply while this is off. Re-enable from the
# Actions tab (the file is kept for that); no file change needed.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Only auto-review PRs authored by the repo owner. External/fork PRs are
    # ignored (we don't take external contributions, and fork PRs don't get
    # the OAuth secret anyway). To allow trusted collaborators, replace this
    # with an explicit login allowlist or an author_association check.
    if: github.event.pull_request.user.login == github.repository_owner

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

